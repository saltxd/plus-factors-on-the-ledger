      outside the ring." Week two: "full rounds on Oct 1, 3, 4 and 6".
    label_basis: [closure_of_hiring_set, shared_funder]
    reconstruction: >-
      Ring members are rebuilt from the public chain exactly as the decode describes them: TermiX
      BSC agents with ids REDACTED..REDACTED hired in SE by owners of other agents in that id range.
      The decode publishes the id range, the registration window and the round structure, but not
      the 48 wallets; a reconstruction that does not give 48 agents is reported, not forced.

