# Case registry for the on-chain collusion-evidence benchmark.
#
# Written Oct 23, 2026 (sprint day 1), BEFORE any feature was computed.
# Labels come only from ChainWard's PUBLISHED decodes (chainward.ai/decodes/<slug>),
# which were written before the sprint (preexisting work, see README).
# No private label sets, tip clusters or paid wallet lists are used.
#
# Unit of analysis: one payee address (a seller / hired agent) in one window.
# The question asked of each case: is the payee's measured demand coordinated
# with the payee itself (self-funded, or money circulating in a closed group),
# or does it come from independent payers?
#
# Label codes
#   C  coordinated: the decode reports a loop, a closed ring, or buyers funded by the seller.
#   I  independent: the decode reports positive evidence of independent buying
#      (many distinct funders, buyers who also pay other sellers, no seller funding).
#   N  no loop found: the decode traced the seller and found no loop, and says this is
#      not a clearance. Weak negative.
#   L  linked, no loop: the decode found a strong common link (one funder seeding many
#      buyers, a shared high-throughput account, an on-ramp) but explicitly did not
#      count it as a loop. These are the "similar behaviour from common
#      infrastructure or incentives" cases of research question 2.3.
# Binary target for detection: coordinated = 1 for C, 0 for I, N and L.
#
# Windows (UTC, end exclusive). Base blocks are 2 s apart; block 50,715,727 = 2026-09-01 00:00:01.
#   W1  2026-09-15 .. 2026-09-22   Base blocks 51,320,527 .. 51,622,926   (x402-on-base)
#   W2  2026-09-22 .. 2026-09-29   Base blocks 51,622,927 .. 51,925,326   (x402-on-base-two-weeks-later)
#   W3  2026-09-29 .. 2026-10-06   Base blocks 51,925,327 .. 52,227,726   (x402-on-base-two-weeks-later)
#   W4  2026-10-06 .. 2026-10-13   Base blocks 52,227,727 .. 52,530,126   (x402-top-ten-self-funded, board of Oct 13 01:19)
#   SE  2026-10-01 .. 2026-10-08   BSC blocks 125,000,755 .. 126,344,213  (set-and-earn-week-one-closed)
#
# Inclusion rules (fixed before data was read):
#   - A (payee, window) is included only if a decode makes a statement about that payee
#     that covers that window: a week-specific statement, or a statement over a longer
#     window that holds for every sub-period (e.g. "not one payment came in from outside").
#   - A case with zero payments in its window is dropped and reported as dropped.
#   - Excluded on purpose: Bankr (bankr-on-chain checks reported revenue against fee
#     receipts and says it did not test wash trading, so it carries no label about payer
#     independence; its fees are also not USDC payments); Storm Station 247 (decode: "not
#     traced"); the Polymer settler (buyer = seller, no counterparty); clashofcoins'
#     second payTo and any seller the decodes mention without a finding.
#   - Addresses the decodes print truncated are resolved on-chain by unique prefix among
#     the window's payees; the resolution is logged in data/.

windows:
  W1: {chain: base, start: "2026-09-15T00:00:00Z", end: "2026-09-22T00:00:00Z", first_block: 51320527, last_block: 51622926}
  W2: {chain: base, start: "2026-09-22T00:00:00Z", end: "2026-09-29T00:00:00Z", first_block: 51622927, last_block: 51925326}
  W3: {chain: base, start: "2026-09-29T00:00:00Z", end: "2026-10-06T00:00:00Z", first_block: 51925327, last_block: 52227726}
  W4: {chain: base, start: "2026-10-06T00:00:00Z", end: "2026-10-13T00:00:00Z", first_block: 52227727, last_block: 52530126}
  SE: {chain: bsc, start: "2026-10-01T00:00:00Z", end: "2026-10-08T00:00:00Z", first_block: 125000755, last_block: 126344213}

