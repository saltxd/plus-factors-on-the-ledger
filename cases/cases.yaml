      REDACTED), with no hire in and
      one $1 hire out ... The 14's hirers and payees share funders that aren't exchange-style hot wallets."
    label_basis: [closure_of_hiring_set, shared_funder]
    reconstruction: >-
      The group is rebuilt as the set of wallets connected to the example transaction's hirer
      through SE hires with $20-$30 budgets on Oct 1, 4 and 6; a result that is not 14 wallets is reported.

